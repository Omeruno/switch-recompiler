<!doctype html><meta charset="utf-8"><style>
html{font-size:18px}body{margin:0} .case{display:flex;width:300px;align-items:flex-start;align-content:flex-start;margin-bottom:12px;gap:10px 20px}
.case>div{width:80px;height:30px;flex:none;background:#26819e}.case>div:nth-child(2n){background:#ad7438}
#wrap,#wraprev{width:190px;flex-wrap:wrap}#wraprev{flex-wrap:wrap-reverse}
#reverse{flex-direction:row-reverse}#grow>div{flex:1 1 0;min-width:0}
#shrink>div{width:150px;flex:0 1 auto;min-width:0}#auto>div:last-child{margin-left:auto}
#between{justify-content:space-between}#column,#colrev{flex-direction:column;width:200px;height:130px}
#colrev{flex-direction:column-reverse}#colauto{flex-direction:column;width:200px;row-gap:12px}
#colwrap{flex-flow:column wrap;width:240px;height:75px}
#percent{height:100px;gap:10% 5%;flex-wrap:wrap;width:200px}
#cyclic{flex-direction:column;row-gap:50%;width:200px}
#units{font-size:20px;gap:1em 2em}#normal{gap:normal}
#cascade{gap:30px 5px;column-gap:15px;gap:-1px}#cascade>div{width:75px}
#edges{width:320px;padding:10px;box-sizing:border-box}#edges>div{width:80px;padding:2px;border:2px solid black;box-sizing:border-box}
#crossbetween{width:190px;height:160px;flex-wrap:wrap;align-content:space-between}
#responsive{gap:10px}@media(max-width:700px){#responsive{gap:24px 40px;width:200px;flex-wrap:wrap}}
</style>
