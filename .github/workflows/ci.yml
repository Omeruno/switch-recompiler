name: CI

on:
  push:
  pull_request:

jobs:
  arm64-fiber:
    name: ARM64 native continuation ABI (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AArch64 compiler and user-mode emulator
        timeout-minutes: 10
        run: |
          # Azure's HTTP package mirror can throttle cross-toolchain payloads.
          # Keep Ubuntu's suites/keyrings; use the official HTTPS archive.
          for apt_source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
      - name: Execute the same ARM64 context switch used by Switch
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -static -fno-exceptions -fno-rtti -I. tests/test_host_fiber.cpp source/runtime/host_fiber.cpp -o /tmp/test_host_fiber_arm64
          qemu-aarch64 /tmp/test_host_fiber_arm64
      - name: Compare fast GDI copies with the reference on ARM64
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -static -fno-exceptions -fno-rtti -I. tests/test_blit_fast_path.cpp source/ui/ui_gdi.cpp source/ui/font.cpp -o /tmp/test_blit_arm64
          qemu-aarch64 /tmp/test_blit_arm64

  host-tests:
    name: Хост-тесты (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate visual project roadmap
        run: python3 tools/check_roadmap_site.py
      - name: mingw-w64 (тестовые программы Windows)
        timeout-minutes: 10
        run: |
          # Apply the same verified HTTPS source policy as the ARM cross tools.
          for apt_source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686 libegl1-mesa-dev libgl-dev
      - name: Регрессия Сапёра и гостевые программы
        run: COMPOSITION_GL_TEST=1 sh tools/run_host_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stage-e-composition-exe
          path: build-host/guest-run.*/gui_composition.exe
      - uses: actions/upload-artifact@v4
        with:
          name: stage-g-host-measurement
          path: |
            build-host/stage-g-measurement.json
            build-host/guest-run.*/graphics_workload.exe
            docs/G1_MEASUREMENTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-g-blit-comparison
          path: |
            build-host/stage-g-blit.json
            build-host/guest-run.*/graphics_workload.exe
            docs/G2_BLIT_AND_PHASES.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-gdi-prototype
          if-no-files-found: error
          path: |
            build-host/gpu_gdi_prototype.log
            docs/G3_GPU_GDI_PROTOTYPE.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-window-coherence
          if-no-files-found: error
          path: |
            build-host/gpu_window_coherence.log
            build-host/guest-run.*/gpu_window_coherence.exe
            docs/G4B2C_CPU_COHERENCE.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-window-bindings
          if-no-files-found: error
          path: |
            build-host/gpu_window_bindings.log
            build-host/guest-run.*/gpu_window_bindings.exe
            docs/G4B2B_WINDOW_BINDINGS.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-gdi-shared-context
          if-no-files-found: error
          path: |
            build-host/gpu_gdi_shared_context.log
            docs/G4B2_SHARED_CONTEXT.md
            docs/G4B2D2_RESIDENT_PRESENTATION.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-gdi-targets
          if-no-files-found: error
          path: |
            build-host/gpu_gdi_targets.log
            docs/G4A_GPU_TARGETS.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-gpu-gdi-batches
          if-no-files-found: error
          path: |
            build-host/gpu_gdi_batches.json
            build-host/gpu_gdi_batches.log
            docs/G4B_GPU_BATCHES.md
      - uses: actions/upload-artifact@v4
        with:
          name: stage-e-acceptance-exe
          path: |
            build-host/guest-run.*/stage_e_acceptance.exe
            docs/STAGE_E_ACCEPTANCE.md

      - uses: actions/upload-artifact@v4
        with:
          name: stage-f-software-acceptance
          path: |
            build-host/stage-f-acceptance.json
            build-host/guest-run.*/shell_bitmap.exe
            build-host/guest-run.*/shell_document.exe
            build-host/guest-run.*/shell_workspace.exe
            build-host/guest-run.*/shell_busy.exe
            docs/F_TEXT_DOCUMENTS.md
            docs/F_IMAGE_DOCUMENTS.md
            docs/F1_FILESYSTEM.md
            docs/STAGE_E_PERFORMANCE.md
            docs/F_ACCEPTANCE.md
            docs/F3C_SHORTCUTS_TREE.md
            docs/F4C_WORKSPACE_LAYERS.md
            docs/F5_FILE_SAVE.md

  gpu-reference:
    name: OpenGL pixels and fallback (EGL/Mesa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesa development libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl-dev
      - name: Actual GL output versus software reference
        run: |
          g++ -std=c++17 -O2 -Wall -fno-exceptions -fno-rtti -DSR_OPENGL_TEST -I. tests/test_presentation_gpu.cpp source/ui/presentation.cpp source/ui/presentation_layers.cpp source/ui/window_layers.cpp source/ui/opengl_presentation.cpp -lEGL -lGL -o /tmp/test_presentation_gpu
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 /tmp/test_presentation_gpu
      - name: Actual GPU GDI prototype and recovery oracle
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -DSR_OPENGL_TEST -I. tests/test_gpu_gdi_prototype.cpp source/ui/gpu_gdi_prototype.cpp source/ui/ui_gdi.cpp source/ui/font.cpp -lEGL -lGL -o /tmp/test_gpu_gdi_prototype
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 /tmp/test_gpu_gdi_prototype
      - name: Shared GDI context preserves the production renderer
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -DSR_OPENGL_TEST -I. tests/test_gpu_gdi_shared_context.cpp source/ui/gpu_gdi_targets.cpp source/ui/gpu_gdi_prototype.cpp source/ui/opengl_presentation.cpp source/ui/presentation.cpp source/ui/presentation_layers.cpp source/ui/window_layers.cpp -lEGL -lGL -o /tmp/test_gpu_gdi_shared_context
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 /tmp/test_gpu_gdi_shared_context
      - name: Multiple GPU targets and presentation without CPU readback
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -DSR_OPENGL_TEST -I. tests/test_gpu_gdi_targets.cpp source/ui/gpu_gdi_targets.cpp source/ui/gpu_gdi_prototype.cpp -lEGL -lGL -o /tmp/test_gpu_gdi_targets
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 /tmp/test_gpu_gdi_targets
      - name: Ordered GPU batches versus single-command reference
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -DSR_OPENGL_TEST -I. tests/benchmark_gpu_gdi.cpp source/ui/gpu_gdi_prototype.cpp -lEGL -lGL -o /tmp/benchmark_gpu_gdi
          python3 tools/benchmark_gpu_batches.py /tmp/benchmark_gpu_gdi /tmp/gpu_gdi_batches.json

  cpu-oracle:
    name: Сверка CPU с железом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-битный gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Сверка (int, x87, SSE)
        run: sh tools/run_cpu_oracle.sh 50000 all

  switch-build:
    name: Сборка для Switch (devkitA64)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenGL/EGL dependencies
        run: dkp-pacman -S --noconfirm --needed switch-mesa switch-glad
      - name: make
        run: make -j"$(nproc)" BUILD_REVISION="$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-recompiler-nro
          path: switch-recompiler.nro

  jit-probe-build:
    name: Экспериментальный JIT NRO (отдельная сборка)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated ARM64 JIT probe
        run: make -C tools/jit_probe -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: jit-permission-probe-nro
          path: tools/jit_probe/jit_probe.nro
