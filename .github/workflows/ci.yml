name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Хост-тесты (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Регрессия Сапёра
        run: sh tools/run_host_tests.sh

  cpu-oracle:
    name: Сверка CPU с железом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-битный gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Сверка (int, x87, SSE)
        run: sh tools/run_cpu_oracle.sh 50000 all

  switch-build:
    name: Сборка для Switch (devkitA64)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-recompiler-nro
          path: switch-recompiler.nro
